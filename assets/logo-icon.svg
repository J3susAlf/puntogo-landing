<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a4a" />
      <stop offset="100%" stop-color="#0e3d6b" />
    </linearGradient>
    <linearGradient id="pgCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c0fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00c0fa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- P Body (Navy) -->
  <path d="M 22 10
           L 58 10
           C 78 10, 92 23, 92 41
           C 92 59, 78 72, 58 72
           L 38 72
           L 38 82
           C 38 88, 33 93, 26 93
           C 20 93, 16 88, 16 82
           L 16 16
           C 16 12.7, 18.7 10, 22 10 Z"
        fill="url(#pgNavy)" />

  <!-- Punto (Cyan Circle on the left edge) -->
  <circle cx="18" cy="41" r="7.5" fill="url(#pgCyan)" filter="url(#glow)" />

  <!-- Go (Cyan Forward Arrow in the P bowl) -->
  <path d="M 42 27
           C 42 24.5, 45 23, 47.2 24.4
           L 70.8 38.4
           C 72.8 39.6, 72.8 42.4, 70.8 43.6
           L 47.2 57.6
           C 45 59, 42 57.5, 42 55
           Z"
        fill="url(#pgCyan)"
        filter="url(#glow)" />
</svg>
