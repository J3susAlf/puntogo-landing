<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="pgNavyFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a4a" />
      <stop offset="100%" stop-color="#0e3d6b" />
    </linearGradient>
    <linearGradient id="pgCyanFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>

  <!-- Isotipo / Icono -->
  <g transform="translate(10, 5) scale(0.7)">
    <!-- P Body (Navy) -->
    <path d="M 22 10
             L 58 10
             C 78 10, 92 23, 92 41
             C 92 59, 78 72, 58 72
             L 38 72
             L 38 82
             C 38 88, 33 93, 26 93
             C 20 93, 16 88, 16 82
             L 16 16
             C 16 12.7, 18.7 10, 22 10 Z"
          fill="url(#pgNavyFull)" />

    <!-- Punto (Cyan Circle) -->
    <circle cx="18" cy="41" r="7.5" fill="url(#pgCyanFull)" />

    <!-- Go (Cyan Arrow) -->
    <path d="M 42 27
             C 42 24.5, 45 23, 47.2 24.4
             L 70.8 38.4
             C 72.8 39.6, 72.8 42.4, 70.8 43.6
             L 47.2 57.6
             C 45 59, 42 57.5, 42 55
             Z"
          fill="url(#pgCyanFull)" />
  </g>

  <!-- Tipografía PUNTO GO -->
  <text x="88" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#0a2a4a">PUNTO</tspan>
    <tspan fill="#00b4d8" dx="3">GO</tspan>
  </text>
  <text x="89" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="2.8">
    PUNTO DE VENTA &amp; CLOUD ERP
  </text>
</svg>
